services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stackscan
      POSTGRES_PASSWORD: stackscan
      POSTGRES_DB: stackscan
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stackscan -d stackscan"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://stackscan:stackscan@db:5432/stackscan
      TEST_DATABASE_URL: postgresql://stackscan:stackscan@db:5432/stackscan_test
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
